[package]
name = "sap-login-manager-slint"
version = "2.0.0"
description = "SAP Login Manager - Slint Edition"
authors = ["you"]
edition = "2021"
license = "GPL-3.0"

[[bin]]
name = "sap-login-manager"
path = "src/main.rs"

[build-dependencies]
slint-build = "1"

[dependencies]
slint = { version = "1", default-features = false, features = ["std", "compat-1-2", "backend-default", "renderer-femtovg", "accessibility"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
aes-gcm = "0.10"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
xmltree = "0.10"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
subtle = "2"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
arboard = { version = "3", default-features = false }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Globalization", "Win32_Security_Cryptography"] }

[profile.release]
lto = true
strip = "symbols"
codegen-units = 1
panic = "abort"
opt-level = "z"
