<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3C/svg%3E" />
    <title>SAP Login Manager</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      #root { width: 100%; height: 100vh; }
      #error-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #1e1e1e; color: #ff6b6b; padding: 20px; font-family: Consolas, monospace; font-size: 14px; overflow: auto; z-index: 99999; white-space: pre-wrap; }
    </style>
    <script>
      window.addEventListener('error', function(event) {
        var overlay = document.getElementById('error-overlay');
        if (overlay) {
          overlay.style.display = 'block';
          overlay.textContent += '[ERROR] ' + event.message + '\n' + (event.filename || '') + ':' + (event.lineno || '') + '\n\n';
        }
      });
      window.addEventListener('unhandledrejection', function(event) {
        var overlay = document.getElementById('error-overlay');
        if (overlay) {
          overlay.style.display = 'block';
          overlay.textContent += '[PROMISE] ' + (event.reason && event.reason.message || event.reason || 'Unknown') + '\n\n';
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="error-overlay"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
