[package]
name = "sap-login-manager"
version = "1.3.0"
description = "SAP Login Manager"
authors = ["you"]
edition = "2021"

[lib]
name = "sap_login_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 生产构建（嵌入前端资源到 exe）必须启用，否则运行时报 "asset not found: index.html"
# 构建：cargo build --release --features custom-protocol
# 请勿删除！！
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
aes-gcm = "0.10"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
xmltree = "0.10"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
subtle = "2"
thiserror = "2"
log = "0.4"
arboard = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Globalization", "Win32_Security_Cryptography"] }

[profile.release]
lto = true
strip = "symbols"
codegen-units = 1
panic = "abort"
opt-level = "z"
