<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SAP Login Manager · 凭据列表优雅版</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --panel-2: #fafbfc;
    --border: #e8eaed;
    --border-strong: #d9dce1;
    --text: #1f2430;
    --text-2: #6b7280;
    --text-3: #9aa1ac;
    --accent: #3b6ef5;
    --accent-soft: #eef3ff;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 4px 16px rgba(16,24,40,.06);
    --shadow-hover: 0 6px 24px rgba(59,110,245,.14);

    /* 环境语义色 */
    --prod: #e5484d;      --prod-bg: #fdecec;
    --test: #d9920a;      --test-bg: #fef5e3;
    --dev: #2f9e44;       --dev-bg: #eaf6ec;
    --none: #7a828e;      --none-bg: #eef0f2;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px;
    display: flex;
    justify-content: center;
  }

  .app {
    width: 640px;
    background: var(--panel);
    border-radius: 16px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    overflow: hidden;
  }

  /* ── 顶部：搜索 + 计数 ── */
  .toolbar { padding: 18px 20px 12px; }
  .search {
    display: flex; align-items: center; gap: 10px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    transition: border-color .18s, box-shadow .18s;
  }
  .search:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
    background: #fff;
  }
  .search svg { color: var(--text-3); flex: none; }
  .search input {
    border: none; outline: none; background: transparent;
    font-size: 14px; color: var(--text); width: 100%;
  }
  .search input::placeholder { color: var(--text-3); }

  .list-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 22px 4px;
    color: var(--text-3); font-size: 12.5px;
  }
  .list-head .group { display: flex; align-items: center; gap: 6px; font-weight: 600; color: var(--text-2); }
  .list-head .count { color: var(--text-3); }

  /* ── 列表 ── */
  .list { padding: 6px 12px 14px; }

  .card {
    position: relative;
    display: grid;
    grid-template-columns: 22px 40px 1fr auto;
    align-items: center;
    gap: 14px;
    padding: 12px 14px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background .16s, box-shadow .16s, transform .16s;
    border: 1px solid transparent;
  }
  .card + .card { margin-top: 2px; }
  .card:hover {
    background: #fff;
    border-color: var(--border);
    box-shadow: var(--shadow-hover);
    transform: translateY(-1px);
  }
  .card.selected {
    background: var(--accent-soft);
    border-color: #cfe0ff;
  }
  /* 左侧环境色条 */
  .card::before {
    content: ""; position: absolute; left: 0; top: 12px; bottom: 12px;
    width: 3px; border-radius: 3px; background: transparent;
    transition: background .16s;
  }
  .card.env-prod:hover::before { background: var(--prod); }
  .card.env-test:hover::before { background: var(--test); }
  .card.env-dev:hover::before  { background: var(--dev); }

  /* 复选框 */
  .card .check {
    width: 16px; height: 16px; border-radius: 5px;
    border: 1.5px solid var(--border-strong); background: #fff;
    transition: border-color .15s, background .15s;
  }
  .card:hover .check { border-color: var(--accent); }
  .card.selected .check { background: var(--accent); border-color: var(--accent); }

  /* 系统头像 */
  .avatar {
    width: 40px; height: 40px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; color: #fff; letter-spacing: .3px;
    box-shadow: inset 0 -2px 6px rgba(0,0,0,.12);
  }
  .avatar.ds4 { background: linear-gradient(135deg, #5b8def, #3b6ef5); }
  .avatar.ps4 { background: linear-gradient(135deg, #f0736b, #e5484d); }
  .avatar.s4h { background: linear-gradient(135deg, #9aa1ac, #6b7280); }

  /* 主信息 */
  .main { min-width: 0; }
  .title-row { display: flex; align-items: center; gap: 8px; }
  .title {
    font-size: 14.5px; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tag {
    flex: none; font-size: 11px; font-weight: 600;
    padding: 2px 8px; border-radius: 6px; line-height: 1.4;
  }
  .tag.prod { color: var(--prod); background: var(--prod-bg); }
  .tag.test { color: var(--test); background: var(--test-bg); }
  .tag.dev  { color: var(--dev);  background: var(--dev-bg); }
  .tag.none { color: var(--none); background: var(--none-bg); }

  .meta { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 12.5px; color: var(--text-2); }
  .meta .lang { font-weight: 600; color: var(--text-2); }
  .meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--text-3); }
  .meta .conn { color: var(--text-2); }

  /* 右侧连接信息（结构化对齐） */
  .info {
    text-align: right; min-width: 96px;
    transition: opacity .16s;
  }
  .info .client { font-size: 14px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
  .info .client.unset { color: var(--text-3); font-weight: 500; font-style: italic; }
  .info .user { font-size: 12px; color: var(--text-3); margin-top: 2px; font-family: "Consolas", monospace; }

  /* hover 快捷操作 */
  .actions {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    display: flex; gap: 4px; opacity: 0; pointer-events: none;
    transition: opacity .16s;
  }
  .card:hover .actions { opacity: 1; pointer-events: auto; }
  .card:hover .info { opacity: 0; }
  .act {
    width: 30px; height: 30px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    background: #fff; border: 1px solid var(--border);
    color: var(--text-2); transition: all .14s;
  }
  .act svg { width: 15px; height: 15px; }
  .act:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  .act.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .act.primary:hover { filter: brightness(1.06); }
  /* 置顶 / 收藏 的激活态（持续高亮，不依赖 hover） */
  .act.pin.active { color: var(--accent); border-color: #cfe0ff; background: var(--accent-soft); }
  .act.fav.active { color: #f5a623; border-color: #f6e0b0; background: #fef6e6; }
  .act.fav.active svg { fill: currentColor; }
  .act.pin.active svg { fill: currentColor; }

  .note { width: 640px; margin: 14px auto 0; color: #9aa1ac; font-size: 12.5px; text-align: center; }
</style>
</head>

  <div class="note">悬停任意行可查看「置顶 · 收藏 · 登录 · 编辑 · 复制」快捷操作 · 环境色条与语义标签统一色彩语言</div>

  <script>
    document.querySelectorAll('.card').forEach(c => {
      c.addEventListener('click', e => {
        if (e.target.closest('.actions')) return;
        document.querySelectorAll('.card').forEach(x => x.classList.remove('selected'));
        c.classList.add('selected');
      });
    });
    // 置顶 / 收藏 支持切换激活态
    document.querySelectorAll('.act.pin, .act.fav').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        btn.classList.toggle('active');
      });
    });
  </script>
