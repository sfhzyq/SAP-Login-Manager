name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: sap-login-manager/tauri-version/src-tauri -> target

      - name: Install frontend dependencies
        run: |
          cd sap-login-manager/tauri-version
          npm install

      - name: Build Tauri app
        run: |
          cd sap-login-manager/tauri-version
          npm run tauri build

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: SAPLoginManager-windows-nsis
          path: sap-login-manager/tauri-version/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: SAPLoginManager-windows-msi
          path: sap-login-manager/tauri-version/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sap-login-manager/tauri-version/src-tauri/target/release/bundle/nsis/*.exe
            sap-login-manager/tauri-version/src-tauri/target/release/bundle/msi/*.msi
          draft: true
          prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
