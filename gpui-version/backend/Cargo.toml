[package]
name = "sap-backend"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "sap_backend"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
aes-gcm = "0.11"
rand = "0.10"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
xmltree = "0.12"
base64 = "0.23"
sha2 = "0.11"
hmac = "0.13"
pbkdf2 = "0.13"
# Argon2id：v2 密钥派生（OWASP 2023 推荐，抗 GPU 爆破）
argon2 = "0.6"
subtle = "2"
thiserror = "2"
log = "0.4"
arboard = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Globalization", "Win32_Security_Cryptography", "Win32_System_Diagnostics_ToolHelp"] }
