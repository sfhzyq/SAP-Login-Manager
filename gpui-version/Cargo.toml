[workspace]
members = ["backend", "app"]
resolver = "2"

[workspace.package]
version = "1.6.1"
edition = "2021"
# BeautifulRust lints 的 allow_attributes* 需要 #[expect]（Rust 1.81+）；
# clear_poison 需要 1.77+。自有代码已使用 slice::as_chunks（1.88 稳定，
# 见 backend/src/bat_parser.rs utf16le_decode），因此真实下限是 1.88：
# 声明更低会让 clippy::incompatible_msrv 报警，且低版本实际无法编译。
rust-version = "1.88"
publish = false

[workspace.dependencies]
sap-backend = { path = "backend" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# gpui-component（长桥维护版，GitHub 公开仓库；已改名 gpui-kit，旧地址自动重定向）
# 用 git 依赖替代本地 path，让 cargo 下载到 CARGO_HOME（C 盘，沙箱可见）
# 用户终端可用 path = "../../gpui-component/crates/kit" 替代本地克隆
# 2026-10-20：锁定 tag v0.8.0（此前未 pin rev，任何 cargo update 都会漂到 main）
gpui-kit = { git = "https://github.com/longbridge/gpui-component", tag = "v0.8.0" }

# 本地补丁：修复 gpui-pre-windows 自绘标题栏窗口左/右/底边缘
# 缩放命中区缺失的问题（原实现只放大了顶边，窗口拖宽后无法拖回）。
# 补丁内容见 vendor/gpui-pre-windows/src/events.rs 的 handle_hit_test_msg；
# 2026-10-20 已随 gpui-kit v0.8.0 重新应用到 gpui-pre-windows 0.3.9 源码。
# 升级 gpui-pre 时需把补丁重新应用到新版本源码。
#
# 本地补丁：rustix build.rs 的 can_compile 特性探测在 spawn rustc 时被
# 终端安全软件拦截（CreatePipe ERROR_PIPE_BUSY 231），补丁在 spawn 失败时按
# "可编译"兜底（探测的 cfg 特性 rustc ≥ 1.84 全部支持），详见
# vendor/rustix/build.rs。
[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
rustix = { path = "vendor/rustix" }

[profile.dev]
codegen-units = 16
debug = "limited"
split-debuginfo = "unpacked"

# 对渲染关键依赖启用 O3，保证 dev 模式 UI 流畅度（与 gpui-component workspace 对齐）
[profile.dev.package]
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
smol = { opt-level = 3 }
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-sum-tree = { opt-level = 3 }
ropey = { opt-level = 3 }

[profile.release]
# 注意：不启用 fat LTO——本机工具链的 LTO 链接会丢失部分被引用的字符串常量
# （如「管理分组」「返回主界面」等 UI 文案），导致二进制损坏、界面文案/行为异常。
# codegen-units=1 时 rustc 自动禁用 LTO，保留 O2 + 单编译单元已有足够优化。
codegen-units = 1
opt-level = 2
